# Railway service settings (config as code). The root all-in-one Dockerfile is used;
# the old nixpacks phases were removed (they pinned node 22, the app needs node 24).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
